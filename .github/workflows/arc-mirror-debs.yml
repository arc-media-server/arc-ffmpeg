# Arc: copies the jellyfin-ffmpeg Debian packages Arc's Docker image installs into a release of this
# fork, checked against the SHA-256 sums Arc's Dockerfile pins. Arc can then download them from
# here, whatever happens upstream. Nothing is compiled: it only downloads, checks and uploads.
name: Arc mirror (jellyfin-ffmpeg debs)
on:
  workflow_dispatch:
    inputs:
      version:
        description: jellyfin-ffmpeg version (e.g. 8.1.3-2)
        required: true
        default: 8.1.3-2
      sha_amd64:
        description: SHA-256 of the trixie amd64 .deb (from Arc's Dockerfile)
        required: true
        default: 82bd7422530740af738891c54b548eadf9bb572ff875976eddbe231e6f02482b
      sha_arm64:
        description: SHA-256 of the trixie arm64 .deb (from Arc's Dockerfile)
        required: true
        default: 21e7f67d3fe70b4c757f8c5064f1317e2580a08b3b84460b7a79af0a99c1095f
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and check
        env:
          V: ${{ inputs.version }}
        run: |
          mkdir mirror
          for arch in amd64 arm64; do
            f="jellyfin-ffmpeg8_${V}-trixie_${arch}.deb"
            curl -fsSL -o "mirror/$f" "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${V}/$f"
          done
          echo "${{ inputs.sha_amd64 }}  mirror/jellyfin-ffmpeg8_${V}-trixie_amd64.deb" | sha256sum -c -
          echo "${{ inputs.sha_arm64 }}  mirror/jellyfin-ffmpeg8_${V}-trixie_arm64.deb" | sha256sum -c -
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          gh release create "v${V}" mirror/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${V} (Arc's mirror)" \
            --notes "jellyfin-ffmpeg ${V} Debian trixie packages used by Arc's Docker image, copied from jellyfin/jellyfin-ffmpeg's v${V} release and checked against Arc's pinned SHA-256 sums. Source: jellyfin/jellyfin-ffmpeg v${V} (this fork mirrors its jellyfin branch)."
